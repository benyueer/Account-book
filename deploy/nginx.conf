user root;
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # include       mime.types;
        # include   /usr/local/etc/nginx/mime.types;
     include       /etc/nginx/mime.types;
    # include E:/app/nginx-1.28.1/nginx-1.28.1/conf/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_static on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    log_format just_body escape=none '$request_body';

    server {
        listen 443 ssl;
        server_name wujiy.cloud;
        #请填写证书文件的相对路径或绝对路径
        ssl_certificate /etc/nginx/wujiy.cloud_nginx/wujiy.cloud_bundle.crt;
        #请填写私钥文件的相对路径或绝对路径
        ssl_certificate_key /etc/nginx/wujiy.cloud_nginx/wujiy.cloud.key;
        ssl_session_timeout 5m;
        #请按照以下协议配置
        ssl_protocols TLSv1.2 TLSv1.3;
        #请按照以下套件配置，配置加密套件，写法遵循 openssl 标准。
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
        ssl_prefer_server_ciphers on;

        root /home/wuji/project/Account-book/apps/client/dist;
        # root /Users/mac/Desktop/pro/invitation/dist;
        # root E:\projects\invitation\dist;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
            # Ensure index.html is never cached
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # 字体文件缓存
        location ~* \.(woff|woff2|ttf|eot|otf|m4a)$ {
            expires max;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin *;
        }

        # 图片文件缓存
        location ~* \.(jpg|jpeg|png|gif|webp|avif|ico|svg)$ {
            expires max;
            add_header Cache-Control "public, max-age=31536000, immutable";
            gzip_vary on;
            gzip_static on;
        }

        # Support for pre-compressed JS files
        location ~* \.js$ {
            add_header Content-Type application/javascript;
            expires max;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Support for pre-compressed CSS files
        location ~* \.css$ {
            add_header Content-Type text/css;
            expires max;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /api {
          rewrite ^/api/(.*)$ /$1 break;
          proxy_pass http://localhost:3000;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

    }
}